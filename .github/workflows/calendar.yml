name: Generate Calendar

on:
  schedule:
    - cron: '5 * * * *'

  workflow_dispatch:

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check Polish time
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)

          if [ "$HOUR" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install libs
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install requests beautifulsoup4

      - name: Generate JSON
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python generate.py

      - name: Commit files
        if: steps.timecheck.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add calendar.json
          git commit -m "Update calendar" || echo "No changes"

          git fetch origin main
          git rebase origin/main

          git push origin main
