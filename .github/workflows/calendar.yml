name: Generate Calendar

on:
  schedule:
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install libs
        run: |
          pip install requests beautifulsoup4

      - name: Generate JSON with Retry
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: python generate.py

      - name: Commit and Push files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add calendar.json
          git commit -m "Update calendar" || echo "No changes"

          # Zabezpieczenie przed konfliktem przy jednoczesnych uruchomieniach
          git pull --rebase origin main || echo "No rebase needed"
          git push
